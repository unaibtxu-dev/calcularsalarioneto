<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEO Panel local — SueldoClaro</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #161f2b;
    --panel-2: #1c2733;
    --border: #2a3644;
    --text: #e6edf3;
    --text-dim: #9aabba;
    --accent: #4da3ff;
    --ok: #2fbf71;
    --warning: #e7a339;
    --error: #e5484d;
    --manual: #8a63d2;
    --serp-bg: #ffffff;
    --serp-title: #1a0dab;
    --serp-url: #202124;
    --serp-desc: #4d5156;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
  }
  header.top {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    background: var(--panel);
  }
  header.top h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header.top .subtitle { color: var(--text-dim); font-size: 12px; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .summary .stat { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .summary .stat b { color: var(--text); }
  .badge-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .badge-dot.ok { background: var(--ok); }
  .badge-dot.warning { background: var(--warning); }
  .badge-dot.error { background: var(--error); }
  .badge-dot.manual { background: var(--manual); }

  .toolbar {
    padding: 10px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .toolbar input[type="search"] {
    flex: 1 1 220px;
    min-width: 160px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .toolbar select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .toolbar .count { color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.3fr);
    gap: 0;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .layout.detail-open .list-pane { display: none; }
    .layout:not(.detail-open) .detail-pane { display: none; }
  }

  .list-pane { border-right: 1px solid var(--border); max-height: calc(100vh - 110px); overflow: auto; }
  .row {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .row:hover { background: var(--panel-2); }
  .row.active { background: #1e2f42; }
  .row .url { font-weight: 600; font-size: 13px; word-break: break-all; }
  .row .title { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .row .flags { display: flex; gap: 6px; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .pill { padding: 1px 6px; border-radius: 999px; font-size: 10px; border: 1px solid var(--border); }
  .pill.warn { color: var(--warning); border-color: var(--warning); }
  .pill.manual { color: var(--manual); border-color: var(--manual); }
  .pill.err { color: var(--error); border-color: var(--error); }

  .back-btn { display: none; margin: 10px 16px 0; }
  @media (max-width: 860px) { .layout.detail-open .back-btn { display: inline-block; } }
  .back-btn button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }

  .detail-pane { padding: 18px 20px 60px; max-height: calc(100vh - 110px); overflow: auto; }
  .empty-state { padding: 40px 20px; color: var(--text-dim); text-align: center; }

  h2.page-title { font-size: 16px; margin: 0 0 2px; word-break: break-word; }
  .page-url { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; word-break: break-all; }

  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .section h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 6px; }
  .kv .k { color: var(--text-dim); }
  .kv .v { word-break: break-word; }

  .device-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .device-toggle button {
    background: var(--panel-2); color: var(--text-dim); border: none; padding: 6px 14px; cursor: pointer; font-size: 12px;
  }
  .device-toggle button.active { background: var(--accent); color: #fff; }

  .serp-card {
    background: var(--serp-bg);
    border-radius: 10px;
    padding: 14px 16px;
    max-width: 600px;
    font-family: Arial, sans-serif;
  }
  .serp-card.mobile { max-width: 340px; }
  .serp-site { display: flex; align-items: center; gap: 8px; color: var(--serp-url); font-size: 13px; margin-bottom: 2px; }
  .serp-favicon { width: 18px; height: 18px; border-radius: 50%; background: #4da3ff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
  .serp-breadcrumb { color: #4d5156; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-bottom: 3px; }
  .serp-title { color: var(--serp-title); font-size: 18px; line-height: 1.3; margin-bottom: 3px; text-decoration: none; }
  .serp-card.mobile .serp-title { font-size: 16px; }
  .serp-desc { color: var(--serp-desc); font-size: 13px; line-height: 1.4; }
  .truncation-note { font-size: 11px; color: var(--text-dim); margin-top: 8px; font-style: italic; }
  .len-check { font-size: 12px; margin-top: 6px; display: flex; gap: 6px; align-items: center; }

  .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .cat-box { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .cat-box .cat-name { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
  .cat-box .cat-status { font-size: 13px; font-weight: 600; }
  .finding-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .finding-list li { padding: 4px 0; border-top: 1px solid var(--border); color: var(--text-dim); }
  .finding-list li:first-child { border-top: none; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .tag.link-ok { border-color: var(--ok); color: var(--ok); }
  .tag.link-missing { border-color: var(--error); color: var(--error); }

  .note { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>SEO Panel — SueldoClaro</h1>
    <div class="subtitle">Herramienta local de solo lectura. No se publica ni se indexa.</div>
  </div>
  <div class="summary" id="summary"></div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Buscar por URL o title…">
  <select id="filter">
    <option value="all">Todo</option>
    <option value="error">Con errores</option>
    <option value="warning">Con warnings</option>
    <option value="manual">Con revisión manual</option>
    <option value="informational">Intent: informational</option>
    <option value="transactional">Intent: transactional</option>
    <option value="no-intent">Sin intent configurado</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="layout" id="layout">
  <div class="back-btn"><button id="backBtn">← Volver al listado</button></div>
  <div class="list-pane" id="listPane"></div>
  <div class="detail-pane" id="detailPane">
    <div class="empty-state">Selecciona una URL de la izquierda para ver su detalle y la preview de Google.</div>
  </div>
</div>

<script>
"use strict";

var ICONOS = { ok: "🟢", warning: "🟠", error: "🔴", manual: "🔎" };
var ETIQUETAS = { ok: "BIEN", warning: "MEJORABLE", error: "ERROR", manual: "REVISIÓN MANUAL" };
var CATEGORIA_LABEL = { technical: "SEO técnico", content: "Contenido / intención", links: "Enlazado interno", trust: "Confianza / transparencia" };

var state = { data: null, filtered: [], selected: null, search: "", filter: "all", device: "desktop" };

function badgeHTML(badge) {
  return '<span class="badge-dot ' + badge + '"></span>' + ICONOS[badge] + " " + ETIQUETAS[badge];
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
}

// --- Filtros / búsqueda -----------------------------------------------

function pasaFiltro(page) {
  var f = state.filter;
  if (f === "all") return true;
  if (f === "error") return page.badge === "error";
  if (f === "warning") return page.badge === "warning" || page.warningCount > 0;
  if (f === "manual") return page.manualCount > 0;
  if (f === "informational") return page.editorial && page.editorial.intent === "informational";
  if (f === "transactional") return page.editorial && page.editorial.intent === "transactional";
  if (f === "no-intent") return !page.editorial || !page.editorial.intent;
  return true;
}

function pasaBusqueda(page) {
  if (!state.search) return true;
  var q = state.search.toLowerCase();
  return (page.cleanUrl && page.cleanUrl.toLowerCase().includes(q)) || (page.title && page.title.toLowerCase().includes(q));
}

function recalcularFiltro() {
  state.filtered = state.data.pages.filter(function (p) { return pasaFiltro(p) && pasaBusqueda(p); });
}

// --- Listado -------------------------------------------------------------

function renderSummary() {
  var s = state.data.summary;
  document.getElementById("summary").innerHTML =
    '<span class="stat"><b>' + s.totalPages + "</b> páginas</span>" +
    '<span class="stat">' + ICONOS.error + " <b>" + s.errors + "</b> errores</span>" +
    '<span class="stat">' + ICONOS.warning + " <b>" + s.warnings + "</b> warnings</span>" +
    '<span class="stat">' + ICONOS.manual + " <b>" + s.manual + "</b> revisión manual</span>";
}

function renderList() {
  document.getElementById("count").textContent = state.filtered.length + " / " + state.data.pages.length + " páginas";
  var html = state.filtered
    .map(function (p) {
      var flags = "";
      if (p.errorCount > 0) flags += '<span class="pill err">' + p.errorCount + " err</span>";
      if (p.warningCount > 0) flags += '<span class="pill warn">' + p.warningCount + " warn</span>";
      if (p.manualCount > 0) flags += '<span class="pill manual">' + p.manualCount + " manual</span>";
      var activa = state.selected && state.selected.cleanUrl === p.cleanUrl ? " active" : "";
      return (
        '<div class="row' + activa + '" data-url="' + esc(p.cleanUrl) + '">' +
        '<span class="badge-dot ' + p.badge + '" title="' + ETIQUETAS[p.badge] + '"></span>' +
        '<span><div class="url">' + esc(p.cleanUrl) + '</div><div class="title">' + esc(p.title || "(sin title)") + "</div></span>" +
        '<span class="flags">' + flags + "</span>" +
        "</div>"
      );
    })
    .join("");
  document.getElementById("listPane").innerHTML = html || '<div class="empty-state">Ninguna página coincide con el filtro actual.</div>';

  Array.prototype.forEach.call(document.querySelectorAll(".row"), function (row) {
    row.addEventListener("click", function () {
      var url = row.getAttribute("data-url");
      var page = state.data.pages.find(function (p) { return p.cleanUrl === url; });
      seleccionar(page);
    });
  });
}

// --- Preview Google (SERP) -----------------------------------------------

var LIMITES_PX = {
  desktop: { title: { font: "20px Arial, sans-serif", maxPx: 600 }, desc: { font: "14px Arial, sans-serif", maxPx: 920 } },
  mobile: { title: { font: "20px Arial, sans-serif", maxPx: 300 }, desc: { font: "14px Arial, sans-serif", maxPx: 460 } }
};

function medirAnchoPx(texto, font) {
  var canvas = medirAnchoPx._canvas || (medirAnchoPx._canvas = document.createElement("canvas"));
  var ctx = canvas.getContext("2d");
  ctx.font = font;
  return ctx.measureText(texto || "").width;
}

function estimarTruncado(texto, tipo, device) {
  if (!texto) return { medible: false };
  var limite = LIMITES_PX[device][tipo];
  var anchoPx = medirAnchoPx(texto, limite.font);
  return { medible: true, anchoPx: Math.round(anchoPx), maxPx: limite.maxPx, probableTruncado: anchoPx > limite.maxPx };
}

function breadcrumbHTML(page, siteOrigin) {
  var host = siteOrigin.replace(/^https?:\/\//, "");
  var segmentos = page.cleanUrl === "/" ? [] : page.cleanUrl.split("/").filter(Boolean);
  return host + (segmentos.length ? " › " + segmentos.join(" › ") : "");
}

function renderSerpPreview(page) {
  var breadcrumb = breadcrumbHTML(page, state.data.siteOrigin);
  var tituloVisible = page.title || "(sin title)";
  var descVisible = page.description || "(sin meta description)";

  var chkTitle = estimarTruncado(tituloVisible, "title", state.device);
  var chkDesc = estimarTruncado(descVisible, "desc", state.device);

  function lenBadge(chk, etiquetaOk, etiquetaWarn) {
    if (!chk.medible) return "";
    var icon = chk.probableTruncado ? "🟠" : "🟢";
    var texto = chk.probableTruncado ? etiquetaWarn : etiquetaOk;
    return '<div class="len-check">' + icon + " " + texto + ' <span class="note">(~' + chk.anchoPx + "px / " + chk.maxPx + "px estimados)</span></div>";
  }

  return (
    '<div class="device-toggle">' +
    '<button data-device="desktop" class="' + (state.device === "desktop" ? "active" : "") + '">Escritorio</button>' +
    '<button data-device="mobile" class="' + (state.device === "mobile" ? "active" : "") + '">Móvil</button>' +
    "</div>" +
    '<div class="serp-card ' + (state.device === "mobile" ? "mobile" : "") + '">' +
    '<div class="serp-site"><span class="serp-favicon">$</span> ' + esc(state.data.siteName) + "</div>" +
    '<div class="serp-breadcrumb">' + esc(breadcrumb) + "</div>" +
    '<div class="serp-title">' + esc(tituloVisible) + "</div>" +
    '<div class="serp-desc">' + esc(descVisible) + "</div>" +
    "</div>" +
    lenBadge(chkTitle, "Título probablemente visible completo", "Título podría truncarse") +
    lenBadge(chkDesc, "Meta description razonable", "Meta description podría truncarse") +
    '<div class="truncation-note">Estimación orientativa por ancho de texto, no por número exacto de caracteres. Google puede reescribir el título y el fragmento mostrado — esta vista es una simulación, no una garantía.</div>'
  );
}

// --- Detalle de página -----------------------------------------------

function categoryBoxHTML(key, cat) {
  var findingsHTML = cat.findings.length
    ? '<ul class="finding-list">' + cat.findings.map(function (f) { return "<li>" + ICONOS[f.severity] + " " + esc(f.message) + "</li>"; }).join("") + "</ul>"
    : "";
  return (
    '<div class="cat-box"><div class="cat-name">' + CATEGORIA_LABEL[key] + '</div><div class="cat-status">' + ICONOS[cat.badge] + " " + ETIQUETAS[cat.badge] + "</div>" +
    findingsHTML +
    "</div>"
  );
}

function relatedTagsHTML(page) {
  if (!page.editorial || !page.editorial.related || page.editorial.related.length === 0) return '<span class="note">Sin relaciones editoriales configuradas.</span>';
  var outboundSet = new Set(page.links.outboundLiteral.concat(page.links.outboundVirtual));
  return (
    '<div class="tag-list">' +
    page.editorial.related
      .map(function (rel) {
        var ok = outboundSet.has(rel);
        return '<span class="tag ' + (ok ? "link-ok" : "link-missing") + '">' + (ok ? "✓" : "✗") + " " + esc(rel) + "</span>";
      })
      .join("") +
    "</div>"
  );
}

function linkListHTML(urls) {
  if (!urls.length) return '<span class="note">Ninguno</span>';
  return '<div class="tag-list">' + urls.map(function (u) { return '<span class="tag">' + esc(u) + "</span>"; }).join("") + "</div>";
}

function renderDetail(page) {
  var editorial = page.editorial;
  var html = "";
  html += '<h2 class="page-title">' + esc(page.title || page.cleanUrl) + "</h2>";
  html += '<div class="page-url">' + esc(state.data.siteOrigin + (page.cleanUrl === "/" ? "/" : page.cleanUrl)) + "</div>";

  html += '<div class="section"><h3>Preview de Google</h3>' + renderSerpPreview(page) + "</div>";

  html += '<div class="section"><h3>Datos básicos</h3><div class="kv">' +
    '<div class="k">Canonical</div><div class="v">' + esc(page.canonical || "—") + "</div>" +
    '<div class="k">Meta description</div><div class="v">' + esc(page.description || "—") + " (" + page.descriptionLength + " car.)</div>" +
    '<div class="k">H1</div><div class="v">' + esc(page.h1 || "—") + (page.h1Count > 1 ? " ⚠ " + page.h1Count + " H1" : "") + "</div>" +
    '<div class="k">Robots</div><div class="v">' + esc(page.robotsMeta || "index, follow (por defecto)") + " — " + (page.indexable ? "indexable ✓" : "NO indexable ✗") + "</div>" +
    '<div class="k">JSON-LD</div><div class="v">' + esc(page.jsonLdType || "—") + "</div>" +
    '<div class="k">En sitemap.xml</div><div class="v">' + (page.inSitemap ? "Sí ✓" : "No ✗") + "</div>" +
    "</div></div>";

  html += '<div class="section"><h3>Target / intención editorial</h3>';
  if (editorial && (editorial.target || editorial.intent)) {
    html += '<div class="kv">' +
      '<div class="k">Target</div><div class="v">' + esc(editorial.target || "—") + "</div>" +
      '<div class="k">Intent</div><div class="v">' + esc(editorial.intent || "—") + "</div>" +
      '<div class="k">Disclaimer</div><div class="v">' + esc(editorial.disclaimerType || "—") + (editorial.requiresDisclaimer ? " (requerido)" : "") + "</div>" +
      '<div class="k">Metodología</div><div class="v">' + (editorial.requiresMethodology ? "requerida" : "no configurada") + "</div>" +
      '<div class="k">Fuente oficial</div><div class="v">' + (editorial.requiresOfficialSource ? "requerida" : "no configurada") + "</div>" +
      "</div>";
  } else {
    html += '<span class="note">Sin target editorial configurado.</span>';
  }
  html += "</div>";

  html += '<div class="section"><h3>Relaciones de cluster (related)</h3>' + relatedTagsHTML(page) + "</div>";

  html += '<div class="section"><h3>Enlazado interno</h3><div class="kv">' +
    '<div class="k">Salientes</div><div class="v">' + linkListHTML(page.links.outboundLiteral) + "</div>" +
    '<div class="k">Entrantes</div><div class="v">' + linkListHTML(page.links.inbound) + "</div>" +
    "</div></div>";

  html += '<div class="section"><h3>Semáforos SEO (por bloque)</h3><div class="cat-grid">' +
    Object.keys(page.categories).map(function (k) { return categoryBoxHTML(k, page.categories[k]); }).join("") +
    "</div></div>";

  document.getElementById("detailPane").innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll(".device-toggle button"), function (btn) {
    btn.addEventListener("click", function () {
      state.device = btn.getAttribute("data-device");
      renderDetail(page);
    });
  });
}

function seleccionar(page) {
  state.selected = page;
  document.getElementById("layout").classList.add("detail-open");
  renderList();
  renderDetail(page);
}

// --- Bootstrap -------------------------------------------------------

function attachToolbar() {
  document.getElementById("search").addEventListener("input", function (e) {
    state.search = e.target.value;
    recalcularFiltro();
    renderList();
  });
  document.getElementById("filter").addEventListener("change", function (e) {
    state.filter = e.target.value;
    recalcularFiltro();
    renderList();
  });
  document.getElementById("backBtn").addEventListener("click", function () {
    document.getElementById("layout").classList.remove("detail-open");
  });
}

fetch("/api/data")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    state.data = data;
    recalcularFiltro();
    renderSummary();
    renderList();
    attachToolbar();
  })
  .catch(function (err) {
    document.getElementById("listPane").innerHTML = '<div class="empty-state">Error cargando /api/data: ' + esc(err.message) + "</div>";
  });
</script>
</body>
</html>
